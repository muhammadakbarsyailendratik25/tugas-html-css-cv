<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Demonstrasi Google Fonts</title>

    <!-- Memuat font dari Google Fonts menggunakan tag <link> -->
     <link rel="preconnect" href="https://fonts.googleapis.com">
     <link rel="preconnect" href="https://fonts.gstatic.com"crossorigin>

     href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Permanent+Market&display=swap" rel="stylesheet">

     <style>
        h1 {
            /* Menerapkan font 'Permanent Marker' dari Google

            font-family: 'Permanent Marker', cursive;
            color: #e74c3c;
            font-size: 32px;
            }

            p {
            /* Menerapkan font 'Caveat' dari Goole */
            font-family: 'Caveat', cursive;
            font-size: 24px;
            color: #2c3e50;
            }
     </style>
</head>
<body>
    <h1>Contoh Font dari Google Fonts</h1>
    <p>
        Paragraf ini dihiasi rupa huruf 'Caveat' yang diimpor secara online langsung dari layangan Google Fonts.
    </p>
</body>
</html>
