<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Demonstrasi Text Overflow</title>
    <style>
        .overflow-box {
            width: 320px;
            white-space; nowrap; /*Memaksa teks tetap dalam 1 baris */
            overflow: hidden; /* Menyembunyikan teks di luar kota */
            text-overflow: ellipsis;/* Menambahkan titik-titik tiga (...) */

            background-color: #eef9bf;
            border: 1px solid #c7ecee;
            padding: 10px;
            font-family: Arial, sans-serif;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <h2>Pengaturan Teks Melimpah (Text Overflow Ellipsis)</h2>

    <p class="overflow-box">
        Ini adalah contoh paragraf yang memiliki sangat panjang melebihi lebar area kontainer 320px. Text yang meluap akan terpotong secara rapi dan diakhiri dengan simbol ellipsis tiga titik.
    </p>
</body>
</html>
