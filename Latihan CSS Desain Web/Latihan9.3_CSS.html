<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Demonstrasi Border Image</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        blockquote {
            margin: 1em;
            padding: 1em;
            font-size: 18px;
            border-width: 1em;
            border-style: solid;
            border-image: url('border.svg') 100 round;
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>
    <blockquote>
        Ini adalah contoh elemen dengan border border image.
    </blockquote>
</body>
</html>
