<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Demonstrasi Selektor Atribut</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        /* Menargetkan elemen input yang memiliki atribut
        type="text" */
        input[type="text"] {
            background: transparent;
            color: #00ffff;
            padding: 10px;
            border: 1px solid #00ffff;
            border-radius: 4px;
            outline: none;
        }
        </style>
</head>
<body>
    <h3>Form Input Teks</h3>
    <input type="text" placeholder="Ketik sesuatu di sini..."
</body>
</html>
