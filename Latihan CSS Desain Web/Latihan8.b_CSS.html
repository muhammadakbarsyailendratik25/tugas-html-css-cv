<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Demonstrasi Font Weight</title>
    <style>
        body {
            font-family: 'Robot' , Arial, sans-serif;
            padding: 20px;
        }

        h1 {
            font-weight: bold;
            color: #2c3e50;
        }

        .light {
            font-weight: 300; /* Atau font-weight: lightwe */
            color: #555555;
        }

        .bold {
            font-weight: bold; /* Atau font-weight: 700 */
            color: #wc3e50;
        }
    </style>
</head>
<body>
    <h1>Contoh Pengaturan Font Weight</h1>
    <p class="light">Font weight berfungsi untuk menentukan tingkat ketebalan font (contoh gaya tipis/lighter).</p>
    <p class="bold">Ini adalah contoh paragraf dengan ketebalan font bold (tebat).</p>
</body>
</html>
