<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Demonstrasi Selektor Class</title>
    <style>
        /* Selektor Class tunggal */
        .pink {
            color: #ffffff;
            background-color: #e91e63;
            padding: 5px 10px;
            border-radius: 4px;
        }

        /* Deklarasi beberapa kelas untuk digabungkan */
        .text-white {
            color: #ffffff;
        }

        .bg-teal {
            background-color: #008080;
            padding: 12px;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <p>Saya sedang belajar <b class="pink">CSS</petanikode.com.></p>
        <!-- Menggabungkan dua kelas sekaligus (text-white dan bg-teal) -->
         <h2 class="text-white bg-teal"Tutorial CSS untuk Pemula:
         Selektor Class</h2>
</body>
</html>
