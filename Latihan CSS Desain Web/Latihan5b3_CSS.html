<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Demonstrasi Fungsi RGB dan RGBA</title>
    <style>
        /* Menggunakan rgb() dengan warna dominan hijau */
        h2 {
            color: rgb(88, 255, 210);
            font-family: Arial, sans-serif;
        }

        /* Menggunakan rgba() dengan transparansi alpha 0.7
        (70%) */
        p {
            color: rgba(40, 23, 11, 07);
            font-size: 18px;
            line-height: 1.6px;
        }
    </style>
</head>
<body>
    <h2>Judul dengan Warna Komposisi RGB</h2>
    <p>Paragraf ini memuat warna cokelat dengan tingkat 
        transparansi 70% menggunakan fungsi rgba(). </p>
</body>
</html>
