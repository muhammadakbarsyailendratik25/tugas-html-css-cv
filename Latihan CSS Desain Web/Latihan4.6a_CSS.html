<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Demonstrasi Pseudo-class</title>
    <style>
        /* Gaya dasar link */
        a {
            color: #3498db;
            text-decoration: none;
            font-weight: bold;
            font-family: Arial, sans-serif;
            transition: color 0.3s ease;
        }

        /* Pseudo-class :hover (saat pointer berada di atas link) */
        a:hover {
            color: #2ecc71;
            text-decoration: underline;
        }
        </style>
</head>
<body>
    <h2>Kunjungi Tautan</h2>
    <a href="https://www.petanikode.com">Link ke Petani Kode</a>
</body>
</html>
