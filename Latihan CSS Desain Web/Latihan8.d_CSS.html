<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Demonstrasi Font Family</title>
    <style>
        h1 {
            /* Menentukan hirarki font utama dan cadangan */
            font-family: Arial, Helvetica, sans-serif;
            color: #2c3e50;
        }

        p {
            font-family: cursive;
            font-size: 16px;
            line-height: 1.6;
            color: #34495e;
        }
    </style>
</head>
<body>
    <h1>Contoh Pengaturan Font Family</h1>
    <p>
        Ini adalah contoh paragraf yang menggunakan keluarga font cursive. Jenis font cursive menampilkan huruf menyerupai tulisan tangan yang cocok untuk suasana santai dan informal.
    </p>
</body>
</html>
