<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Demonstrasi Font Size</title>
    <style>
        h1 {
            font-size: 24px;
            color: slateblue;
            font-family: Arial, sans-serif;
        }

        .font-big {
            font-size: x-large;
        }

        .font-normal {
            font-size: 16px; /* Ukuran standar */
        }

        .font-small {
            font-size: small;
        }
    </style>
</head>
<body>
    <h1>Contoh Pengaturan Font Size</h1>
    <p class="font-big">Ini adalah paragraf dengan ukuran font besar (x-large).</p>
    <p class="font-normal">Ini adalah paragraf dengan ukuran font normal (16px).</p>
    <p class="font-small">Ini adalah paragraf dengan ukuran font kecil(small).</p>
</body>
</html>
