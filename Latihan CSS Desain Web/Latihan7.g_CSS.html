<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Demonstrasi Text Shadow</title>
    <style>
        .shadow-basic {
            color: #2ecc71;
            font-size: 32px;
            font-family: Arial, sans-serif;
            font-weight: bold;
            /* Offset X: 2px, Offset Y: 2px, Blur: 4px, Warna: Hitam Transparan 50% */
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .shadow-glow {
            color: #ffffff;
            background-color: #2c3e50;
            padding: 15px;
            font-size: 28px;
            font-family: Arial, sans-serif;
            /* Efek pendaran neon (glow effect) */
            text-sadow: 0 0 8px #00ffff, 0 0 15px #00ffff;
        }
    </style>
</head>
<body>
    <h2>Penggunaan Efek Bayangan Teks (Teks Shadow)</h2>

    <p class="shadow-basic">Teks dengan Bayangan Halus (Soft Shadow)</p>

    <p class="shadow-glow">Teks Efek Neon Glowing Shadow</p>
</body>
</html>
