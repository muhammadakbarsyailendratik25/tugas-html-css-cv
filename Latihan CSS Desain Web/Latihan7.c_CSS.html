<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Demonstrasi Text Decoration</title>
    <style>
        h1 {
        text-decoration: underline;
        font-family: Arial, sans-serif;
        color: #2c3e50;
        }
        p {
            font-family: Arial, sans-serif;
            line-height: 1.8;
            font-size: 16px;
        }

        .upperline {
            text-decoration: overline dashed violet; /* Garis atas putus-putus berwarna ungu */
        }

        .underline-wavy {
            text-decoration: underline wavy green; /* Garis bawah bergelombang berwarna hijau */
        }

        .strike-red {
            text-decoration: line-through red; /* Garis coret berwarna merah */
        }
    </style>
</head>
<body>
    <h1>Contoh Text Decoration Modern</h1>

    <p>
        Ini adalah contoh <span clas="underline-wavy">teks dengan garis bawahb bergelombang hijau</span>.<br>
        Ini adalah teks normal tanpa hiasan.<br>
        Ini adalah teks dengan <span class="strike-red">harga yang dicoret merah</span>.<br>
        Ini adlah <span class="upperline">teks dengan garis atas putus-putus berwarna violet</span>
    </p>
</body>
</html>
