<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Demonstrasi Border Radius</title><style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        header,article, footer {
            border: 1px solid silver;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 16px;
        }
    </style>
</head>
<body>
    <header>
        <h1> Latihan Border Radius</h1>
    </header>

    <article>
        <p>Properti border-radius mengubah sudut siku yang lancip menjadi tumpul berbentuk melengkung. Nilai kelengkungan 16px memberikan sudut melengkung yang halus pada seluruh kotak komponen.</p>
    </article>

    <footer>
        <p>Copyright &copy; Petani Kode</p>
    </footer>
</body>
</html>
