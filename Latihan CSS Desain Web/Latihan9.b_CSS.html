<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>emonstrasi Garis pada Sisi Tertentu</title>
    <style>
        body {
            font-family: AArial, sans-serif;
            padding: 20px;
        }

        header{
            border-bottom: 2px dashed silver;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        main {
            padding: 10px;
        }

        footer {
            border-top: 1px solod gray;
            padding-top: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Latihan CSS Border Sisi Tertentu</h1>
</header>

<main>
    <p>Contoh ini mendemonstrasikan garis pada posisi tertentu. Elemen header menggunakan garis batas bawah putus-putus (dashed) berwarna perak, sedangkan bagian footer dilengkapi garis batas atas tipis solid berwarna abu-abu.</p>
</main>

<footer>
    <p>Copyright &copy; Petani Kode</p>
</footer>
</body>
</html>
