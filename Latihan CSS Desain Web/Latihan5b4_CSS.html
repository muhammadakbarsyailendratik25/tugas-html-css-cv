<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Demonstrasi Fungsi HSL dan HSLA</title>
    <style>
        /* Menggunakan hsl() */
        h1 {
            color: hsl(324, 70%, 40%);
            font-family: Arial, sans-serif;
        }
        /*  Menggunakan hsla() dengan transparan 60% */
        .text-hsla {
            color: hsla(267, 80%, 45%, 0.6);
            font-size: 18px;
        }
        </style>
</head>
<body>
    <h1>Judul H1 Menggunakan Warna HSL</h1>
    <p  class="text-hsla">Text ini menggunakan skema warna ungu
         interaktif dengan fungsi hsla().</p>
</body>
</html>
