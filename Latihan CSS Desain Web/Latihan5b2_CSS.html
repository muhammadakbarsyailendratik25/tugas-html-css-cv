<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Demonstrasi Kode Heksadesimal</title>
    <style>
        /* Format 6 digit heksadesimal (#RRGGBB) */
        .text-hex-6
        color: #0011ff; /* Komposisi biru dominan */
        font-weight: bold;
    }

    /* Format 3 digit hesadesimal (#RGB) */
    .text-hex-3
    color: #01f; /* Singkatan dari #0011ff */
    font-style: italic;
}
    </style>
</head>
<body>
    <p  class="text-hex-6">Text ini menggunakan kode heksadesimal 6 digit (#0011ff).</p>
    <p  class="text-hex-3">Text ini menggunakan kode heksadesimal 3 digit ringkas (#01f).</p>
</body>
</html>
