<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Demonstrasi Text Transform</title>
    <style>
        h1 {
            text-transform: capitalize; /* Kapitalisasi huruf awal setiap kata */
            font-family: Arial, sans-serif;
            color: #2980b9;
        }

        .upper {
            text-transform: uppercase; */ Mengubah menjadi kapital penuh */
            font-weight: bold;
        }

        .lower {
            text-transform: lowercase; /* Mengubah menjadi huruf kecil penuh */
        }

        P{
            font-family: Arial, sans-serif;
            font-size: 16px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <h1>latihan teks transform di css</h1>

    <p>
        Pesan ini dipersonalisasi: <span class="upper">hello world</span> - kalimat ini ditulis kecil di HTML namun tampil kapital.<br>
        <span class="lower">TEKS INI SEMULA DITULIS DENGAN HURUF KAPITAL BESAR, NAMUN CSS MENGUBAHNYA MENJADI HURUF KECIL KESELURUHAN.</span>
    </p>
</body>
</html>
