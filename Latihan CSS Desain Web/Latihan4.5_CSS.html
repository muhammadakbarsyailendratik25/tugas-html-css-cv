<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Demonstrasi Selektor Universal</title>
    <style>
        /* 1. CSS Reset: Menghilangkan margin dan padding bawaan browser pada seluruh elemen */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        </style>
</head>
<body>
    <h2>Implementasi Selektor Universal</h2>
    <p>Penggunaan simbol asterisk (*) memastikan seluruh elemen HTML diatur ulang margin dan padding-nya menjadi nol terlebih dahulu.</p>
</body>
</html>
