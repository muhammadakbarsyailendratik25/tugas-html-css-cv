<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Demonstrasi Properti Color</title>
    <style>
        /* Mmeberikan warna orange pada seluruh judul h1 */
        h1 {
            color: orange;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        /* Memberikan warna defauly abu-abu gelap pada paragraf
*/
        p {
            color: #333333;
            font-size: 16px;
            line-height: 1.6;
        }
        </style>
</head>
<body>
    <h1>Selamat Datang di Tutorial Warna CSS</h1>
    <p>Properti color digunakan untuk mengubah warna teks pada
        elemen HTML agar tampilan visual halaman web menjadi lebih 
        hidup dan menarik. </p>
</body>
</html>
