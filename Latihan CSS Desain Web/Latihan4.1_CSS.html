<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Demonstrasi Selektor Tag</title>
    <style>
        /* Selektor Tag: Mengubah
menjadi biru */
p {
    color: #2980b9;
    font-family: Arial, sans-serif;
    font-size: 16px;
    line-height: 1.6;
}
</style>
</head>
<body>
    <div>Halo apa kabar, saya sedang belajar CSS</div>
    <p>Materi yang sedang kita bahas adalah Selektor Tag.</p>
    <div>Saat ini sedang dibahas tentang Selektor tag pada CSS.</div>
    <p>Selektor tag adalah selektor untuk memilih elemen HTML
    berdasarkan nama tagnya secara menyeluruh.</p>
</body>
</html>
