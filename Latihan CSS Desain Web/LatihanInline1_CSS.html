<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Demonstrasi Inline CSS</title>
</head>
<body>
    <h2 style="color: #e74c3c; font-family: Arial,sans-serif;">Judul Artikel Menggunakan Inline CSS</h2>

        </p>
