<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Demonstrasi Cara Mmebuat Garis</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        header {
            border: 2px solid blue;
            text-align: center;
            margin-bottom: 15px;
            padding: 10px;
        }

        article {
            border: 2px solid fuchsia;
            padding: 15px;
            margin-bottom: 15px;
        }

        footer {
            text-align: center;
            padding: 10px;
            border: 2px solid green;
        }
    </style>
</head>
<body>
    <header>
        <h1>Latihan CSS Border</h1>
    </header>

    <article>
        <p>Ini adalah contoh paragraf artikel untuk latihan penggunaan properti border di CSS. Properti border berguna untuk membentuk batas pada sisi-sisi elemen HTML, sehingga antar elemen terlihat terpisah dengan jelas dan terstruktur.</p>
    </article>

    <footer>
        <p>&copy; 2026 Petani Kode</p>
    </footer>
</body>
</html>
