<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Demonstrasi Font Style</title>
    <style>
        blockquote {
            font-style: italic;
            font-size: 18px;
            color: dodgerblue;
            border-left: 4px solid dodgerblues;
            padding-left: 15px;
            margin: 20px 0;
            font-family: Georgia, serif;
        }

        cite {
            font-size: 14px;
            font-style: normal;
            color: fuchsia;
            display: block;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <h1>Contoh Pengaturan Font Style</h1>
    <blockquote>
        "Hidup itu sebentar. Kamu harus bisa tersenyum saat merasakan kepedihan atau kita tak akaan pernah melanjutkan hidup."
        <cite>~ Jeff Ross</cite>
    </blockquote>
</body>
</html>
