<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Demonstrasi Jenis Garis Border Style</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        header {
            border-bottom: 4px double blue;
            padding-bottom: 10px;
        }

        article {
            border: 2px dotted green;
            padding: 15px;
            margin: 15px 0;
        }

        footer {
            border-top: 2px dashed gray;
            padding-top: 10px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Latihan Border Style</h1>
    </header>

    <article>
        <p>Gaya garis dapat divariasikan dengan mudah. <Header>menggunakan garis ganda (double), artikel ini dibingkai dengan garis titik-titik (dotted), dan footer menggunakan garis putus-putus (dashed).</p>
    </article>
</body>
</html>
