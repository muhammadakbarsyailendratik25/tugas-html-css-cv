<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Demonstrasi Komentar CSS</title>

    <style>

        /*
        ==================================================
        BAGIAN 1: ATURAN ELEMEN PARAGRAF
        ==================================================
        */

        p {
            font-family: Arial, sans-serif;
            font-size: 16px;
            line-height: 1.6;

            /*
            Properti di bawah ini disembunyikan
            sementara saat pengujian:
            */

            /* color: red; */

            color: #2c3e50; /* Warna akhir yang digunakan */
        }

        /* Komentar satu baris: Pengaturan gaya tombol */

        .btn {
            background-color: #2ecc71;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
        }

    </style>

</head>

<body>

    <h2>Penggunaan Komentar dalam CSS</h2>

    <p>
        Paragraf ini menggunakan warna teks abu-abu gelap
        (#2c3e50) karena aturan warna merah (color: red)
        berada di dalam penulisan komentar sehingga diabaikan browser.
    </p>

    <button class="btn">Tombol Aksi</button>

</body>

</html>
