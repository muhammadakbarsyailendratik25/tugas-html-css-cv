<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Demonstrasi Properti dan Nilai CSS</title>

    <style>

        blockquote {
            /* Nilai font berjenis dapat tanda petik, disertai nilai cadangan (fallback) */
            font-family: "Times New Roman", Georgia, serif;

            /* Nilai ukuran dan warna */
            font-size: 18px;
            color: #34495e;

            /* Properti tata letak dan dekorasi */
            background-color: #f8f9fa;
            border-left: 4px solid #e74c3c;
            padding: 12px 20px;
            margin: 20px 0;
            font-style: italic;
        }

    </style>

</head>

<body>

    <blockquote>
        "Sintaksis CSS yang tepat merupakan dasar
        agar dapat menerjemahkan rancangan visual sesuai
        persis dengan apa yang diinginkan oleh pengembang web."
    </blockquote>

</body>

</html>
